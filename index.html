<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Katalog Toko & Member Poin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="demo-db.js"></script>
<style>
:root{--pri:#ee4d2d;--pri-d:#d73211;--pri-l:#fff4f1;--bg:#f5f5f5;--card:#fff;--tx:#222;--mut:#757575;--bd:#e8e8e8;--ok:#26aa99;--warn:#f69113;--err:#e02c2c;--r:4px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--tx);font-size:14px}
a{color:var(--pri);text-decoration:none}
/* ---- header oranye ala marketplace ---- */
header{position:sticky;top:0;z-index:20;background:linear-gradient(-180deg,#f53d2d,#f63);box-shadow:0 1px 4px #0002}
.bar{max-width:1200px;margin:auto;display:flex;align-items:center;gap:14px;padding:10px 16px}
.logo{font-weight:800;font-size:20px;color:#fff;white-space:nowrap;letter-spacing:.3px}
.srch{flex:1;display:flex;background:#fff;border-radius:3px;padding:3px;min-width:0}
.srch input{border:0;padding:8px 10px;flex:1;min-width:0;outline:none;border-radius:2px}
.srch button{border:0;background:var(--pri);color:#fff;border-radius:2px;padding:0 16px;cursor:pointer}
.hcart{position:relative;color:#fff;display:flex;align-items:center;padding:4px}
.hcart svg{width:28px;height:28px}
.cbadge{position:absolute;top:-4px;right:-8px;background:#fff;color:var(--pri);border:1px solid var(--pri);border-radius:99px;font-size:11px;font-weight:700;padding:0 6px;line-height:16px}
.nav{display:flex;gap:2px;flex-wrap:wrap;align-items:center}
.nav a{padding:6px 10px;border-radius:3px;color:#fff;font-size:13.5px;opacity:.95}
.nav a.on,.nav a:hover{background:#ffffff2e;opacity:1}
.badge{background:#fff;color:var(--pri);border-radius:99px;padding:0 6px;font-size:11px;margin-left:3px;font-weight:700}
body.is-admin .srch,body.is-admin .hcart{display:none}
body.is-admin .bar{justify-content:space-between}
/* ---- bottom nav (HP) ---- */
.bnav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--bd);padding:4px 0 calc(4px + env(safe-area-inset-bottom))}
.bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:#555;position:relative}
.bnav a svg{width:23px;height:23px}
.bnav a.on{color:var(--pri)}
.bnav .cbadge{top:-3px;right:calc(50% - 22px);background:var(--pri);color:#fff;border-color:#fff}
main{max-width:1200px;margin:auto;padding:12px 16px}
h1{font-size:19px;margin:4px 0 12px}h2{font-size:16px;margin:16px 0 8px}
.card{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:0 1px 2px #0000000d}
/* ---- produk grid ---- */
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.prod{background:#fff;border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;cursor:pointer;box-shadow:0 1px 2px #0000000f;transition:transform .1s,box-shadow .1s;border:1px solid transparent}
.prod:hover{transform:translateY(-1px);box-shadow:0 2px 8px #0002;border-color:var(--pri)}
.prod .img{aspect-ratio:1;background:#fafafa center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:#bbb;font-size:40px;position:relative}
.prod .tag{position:absolute;top:0;right:0;background:#ffd424;color:var(--pri);font-size:11px;font-weight:700;padding:2px 5px}
.prod .habis{position:absolute;inset:0;background:#0006;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.prod .b{padding:8px;display:flex;flex-direction:column;gap:6px;flex:1}
.prod .n{font-size:13px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:35px}
.prod .p{color:var(--pri);font-size:16px;font-weight:500}.prod .p small{font-size:11px;margin-right:1px}
.prod .meta{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);margin-top:auto}
.banner{border-radius:var(--r);background:linear-gradient(120deg,#ee4d2d 0%,#ff7337 55%,#ffb03b 100%);color:#fff;padding:20px 22px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px;overflow:hidden}
.banner b{font-size:21px;display:block}.banner span{opacity:.95;font-size:13px}
.banner .pt{background:#fff;color:var(--pri);border-radius:6px;padding:8px 12px;text-align:center;font-weight:700;white-space:nowrap}
.banner .pt small{display:block;font-weight:400;color:var(--mut);font-size:11px}
.cats{display:flex;gap:8px;overflow-x:auto;padding:12px;background:#fff;border-radius:var(--r);margin-bottom:10px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.sect{background:#fff;padding:12px 14px;color:var(--pri);font-weight:600;border-bottom:3px solid var(--pri);border-radius:var(--r) var(--r) 0 0;margin-bottom:8px;text-transform:uppercase;font-size:14px}
.mut{color:var(--mut);font-size:12.5px}
/* ---- tombol & form ---- */
.btn{border:0;border-radius:2px;padding:9px 14px;font-weight:500;cursor:pointer;background:var(--pri);color:#fff;font-size:14px}
.btn:hover{background:var(--pri-d)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.o{background:var(--pri-l);color:var(--pri);border:1px solid var(--pri)}
.btn.g{background:#fff;color:var(--tx);border:1px solid var(--bd)}.btn.g:hover{background:#f8f8f8}
.btn.ok{background:var(--ok)}.btn.err{background:var(--err)}
.btn.wa{background:#25d366}.btn.sm{padding:5px 10px;font-size:12.5px}.btn.blk{width:100%}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid #ddd;border-radius:2px;font:inherit;background:#fff}
input:focus,select:focus,textarea:focus{outline:none;border-color:#999}
label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:1}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar>input{flex:1;min-width:180px}.toolbar>select{width:auto}
table{width:100%;border-collapse:collapse;background:#fff}
th,td{padding:9px 10px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top;font-size:13.5px}
th{background:#fafafa;font-size:12.5px;color:var(--mut);font-weight:500}
.tw{overflow-x:auto;border-radius:var(--r);box-shadow:0 1px 2px #0000000d}
.st{display:inline-block;padding:2px 8px;border-radius:2px;font-size:11.5px;font-weight:600}
.st.menunggu{background:#fff4e5;color:#c26b00}.st.dikonfirmasi{background:#e8f1ff;color:#1e5bd8}
.st.dikirim{background:#f1eaff;color:#6b36d1}.st.selesai,.st.disetujui{background:#e6f7f4;color:#13836f}
.st.batal,.st.ditolak{background:#fdecec;color:#c62020}
.stats{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin-bottom:14px}
.stat{background:#fff;border-radius:var(--r);padding:14px;color:var(--tx);box-shadow:0 1px 2px #0000000d}
.stat b{display:block;font-size:22px;margin-top:4px}
.poinbox{background:linear-gradient(120deg,#ee4d2d,#ff7337 60%,#ffb03b);color:#fff;border-radius:8px;padding:20px;margin-bottom:14px}
.poinbox b{font-size:34px;display:block}
.auth{max-width:420px;margin:24px auto}
.qty{display:flex;align-items:center;gap:0;border:1px solid #ddd;border-radius:2px;width:max-content}
.qty .btn{border:0;border-radius:0;padding:4px 10px}.qty span{min-width:34px;text-align:center;border-left:1px solid #ddd;border-right:1px solid #ddd;padding:4px 0}
.two{display:grid;gap:12px;grid-template-columns:1.4fr 1fr}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;z-index:70;padding:16px}
.modal>.card{width:100%;max-width:520px;max-height:90vh;overflow:auto}
.toast{position:fixed;top:45%;left:50%;transform:translate(-50%,-50%);background:#000c;color:#fff;padding:14px 20px;border-radius:4px;z-index:99;font-size:14px;text-align:center;max-width:80vw}
.toast.err{background:#c62020ee}
.sugg{border:1px solid var(--bd);border-radius:2px;margin-top:4px;max-height:220px;overflow:auto;background:#fff}
.sugg div{padding:8px 10px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--bd)}.sugg div:hover{background:var(--pri-l)}
.svc{border:1px solid var(--bd);border-radius:2px;padding:9px 11px;margin-top:6px;display:flex;gap:8px;align-items:center;cursor:pointer}
.svc:has(input:checked){border-color:var(--pri);background:var(--pri-l)}
.svc input{width:auto}
.sum div{display:flex;justify-content:space-between;padding:4px 0}.sum .tot{font-weight:700;font-size:17px;border-top:1px solid var(--bd);padding-top:8px;margin-top:4px;color:var(--pri)}
footer{text-align:center;color:var(--mut);font-size:12px;padding:24px 10px 40px}
.chip{display:inline-block;padding:6px 14px;border-radius:2px;border:1px solid var(--bd);background:#fff;cursor:pointer;font-size:13px;white-space:nowrap;color:var(--tx)}
.chip.on{background:var(--pri-l);color:var(--pri);border-color:var(--pri)}
.empty{text-align:center;padding:40px;color:var(--mut)}
/* ---- detail produk (sheet) ---- */
.pd{position:fixed;inset:0;z-index:60;background:var(--bg);overflow:auto;padding-bottom:70px}
.pd .top{position:sticky;top:0;display:flex;justify-content:space-between;padding:10px;z-index:2;pointer-events:none}
.pd .top button{pointer-events:auto;width:36px;height:36px;border-radius:50%;border:0;background:#0006;color:#fff;font-size:18px;cursor:pointer}
.pd .wrap{max-width:900px;margin:-56px auto 0;background:#fff}
.pd .pimg{aspect-ratio:1;max-height:520px;width:100%;background:#fafafa center/contain no-repeat;display:flex;align-items:center;justify-content:center;font-size:80px;color:#ccc}
.pd .inf{padding:14px 16px;border-bottom:8px solid var(--bg)}
.pd .pr{color:var(--pri);font-size:24px;font-weight:500}
.pd .nm{font-size:16px;margin:6px 0;line-height:1.4}
.pd .kv{display:flex;padding:10px 16px;font-size:13px;border-bottom:1px solid var(--bd)}.pd .kv span:first-child{width:110px;color:var(--mut)}
.pd .ds{padding:14px 16px;white-space:pre-wrap;line-height:1.6;font-size:13.5px}
.pd .act{position:fixed;left:0;right:0;bottom:0;display:flex;background:#fff;border-top:1px solid var(--bd);height:54px;z-index:3;padding-bottom:env(safe-area-inset-bottom)}
.pd .act>*{border:0;cursor:pointer;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.pd .act .ch{width:84px;background:#fff;color:var(--ok);font-size:11px}
.pd .act .ad{flex:1;background:#26aa99;color:#fff}
.pd .act .by{flex:1;background:var(--pri);color:#fff;font-size:15px}
.pd .act button:disabled{opacity:.5}
/* ---- iklan popup ---- */
.popik{position:fixed;inset:0;z-index:80;background:#000a;display:flex;align-items:center;justify-content:center;padding:24px;animation:pfade .2s}
.popik .box{position:relative;max-width:min(380px,88vw);animation:pzoom .25s}
.popik img{display:block;width:100%;max-height:78vh;object-fit:contain;border-radius:10px}
.popik .x{position:absolute;top:-14px;right:-14px;width:36px;height:36px;border-radius:50%;border:2px solid #fff;background:#0009;color:#fff;font-size:16px;cursor:pointer;z-index:2}
.popik .cta{display:block;margin:12px auto 0;border:0;border-radius:99px;background:linear-gradient(#ffd54a,#ffb300);color:#7a2e00;font-weight:800;font-size:16px;padding:11px 28px;cursor:pointer;box-shadow:0 3px 0 #c77a00}
.popik .dots{display:flex;gap:5px;justify-content:center;margin-top:10px}.popik .dots span{width:7px;height:7px;border-radius:50%;background:#fff6}.popik .dots span.on{background:#fff}
.baris{background:#fff;border-radius:var(--r);padding:10px 12px 12px;margin-bottom:10px;position:relative}
.baris .hd{font-size:12px;font-weight:600;color:var(--warn);margin-bottom:8px;text-transform:uppercase;letter-spacing:.3px}
.baris .trk{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none}
.baris .trk::-webkit-scrollbar{display:none}
.baris .it{flex:0 0 calc((100% - 20px)/3);aspect-ratio:16/7;scroll-snap-align:start;border-radius:6px;overflow:hidden;background:#f3f3f3 center/cover no-repeat;cursor:pointer;position:relative}
.baris .it.ph{border:2px dashed #f7a35c;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#e07020;font-weight:700;text-align:center;font-size:14px;gap:4px;background:#fff8f2}
.baris .it.ph small{font-weight:400;color:var(--mut);font-size:12px}
.baris .nv{position:absolute;top:50%;width:32px;height:32px;border-radius:50%;border:0;background:#fffe;box-shadow:0 1px 4px #0003;cursor:pointer;font-size:18px;color:#555;z-index:2}
.baris .nv.l{left:4px}.baris .nv.r{right:4px}
@media(max-width:800px){.baris .it{flex-basis:86%}.baris .nv{display:none}}
@keyframes pfade{from{opacity:0}}@keyframes pzoom{from{transform:scale(.85);opacity:0}}
@media(max-width:800px){
  .two{grid-template-columns:1fr}
  .grid{grid-template-columns:repeat(2,1fr);gap:6px}
  main{padding:8px 8px 76px}
  .bar{padding:8px 10px;gap:10px}
  .logo{font-size:16px}
  body:not(.is-admin) .nav{display:none}
  body:not(.is-admin) .bnav{display:flex}
  body.is-admin .bar{flex-wrap:wrap}
  body.is-admin .nav a{padding:5px 7px;font-size:12.5px}
  .banner{padding:14px 16px}.banner b{font-size:17px}
  .srch button{display:none}
  footer{padding-bottom:80px}
}
</style>
</head>
<body>
<header><div class="bar"><a class="logo" href="#/katalog" id="logo">Toko</a>
  <form class="srch" onsubmit="cariHeader();return false"><input id="hq" placeholder="Cari produk di toko" autocomplete="off"><button aria-label="Cari"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></button></form>
  <a class="hcart" href="#/keranjang" aria-label="Keranjang"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 4h2l2.4 11h11l2-8H6.3"/><circle cx="9" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/></svg><span id="hcn" class="cbadge" style="display:none"></span></a>
  <nav class="nav" id="nav"></nav></div></header>
<nav class="bnav" id="bnav"></nav>
<main id="app"><div class="empty">Memuat…</div></main>
<footer>Develop Program (MIZAN&amp;NORMAN)</footer>
<div id="modalRoot"></div>

<script>
/* ================= KONFIGURASI ================= */
const DEMO_MODE = false; // true = data di browser (tanpa server). false = pakai backend
const SUPABASE_URL = 'https://xkwaudqodbcwjfdhrunu.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_cVpGcGWXl_8fKrDLxDFlGg_vQ53qLhx';
/* =============================================== */

const sb = (DEMO_MODE && window.DemoDB) ? DemoDB.createClient() : supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const S = { session:null, profile:null, settings:{}, cart: JSON.parse(localStorage.getItem('cart')||'[]'), rt:null };
const $ = s => document.querySelector(s);
const app = $('#app');
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp = n => 'Rp' + Number(n||0).toLocaleString('id-ID');
const tgl = d => d ? new Date(d).toLocaleString('id-ID',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}) : '-';
const isAdmin = () => S.profile?.role === 'admin';
function toast(msg, err){ const t=document.createElement('div'); t.className='toast'+(err?' err':''); t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), 3200); }
function fail(e){ console.error(e); toast(e?.message || String(e), true); }
function saveCart(){ localStorage.setItem('cart', JSON.stringify(S.cart)); renderNav(); }
function modal(html){ $('#modalRoot').innerHTML = `<div class="modal" onclick="if(event.target===this)closeModal()"><div class="card">${html}</div></div>`; }
function closeModal(){ $('#modalRoot').innerHTML=''; }
const ok = r => { if (r.error) throw r.error; return r.data; };

/* ---------- BERAT J&T: toleransi 0,3 kg, min 1 kg ---------- */
const kgJnt = g => Math.max(1, Math.ceil(g/1000 - 0.3));

/* ================= INIT ================= */
async function loadSettings(){
  const d = ok(await sb.from('settings').select('*'));
  S.settings = Object.fromEntries(d.map(x=>[x.key,x.value]));
  $('#logo').textContent = S.settings.nama_toko || 'Toko';
  document.title = S.settings.nama_toko || 'Toko';
}
async function loadProfile(){
  S.profile = null;
  if (!S.session) return;
  const { data } = await sb.from('profiles').select('*').eq('id', S.session.user.id).maybeSingle();
  S.profile = data;
}
async function init(){
  try { await loadSettings(); } catch(e){ app.innerHTML = `<div class="card">Gagal konek Supabase. Cek SUPABASE_URL & ANON KEY di index.html.<br><span class="mut">${esc(e.message)}</span></div>`; return; }
  const { data:{ session } } = await sb.auth.getSession();
  S.session = session; await loadProfile();
  sb.auth.onAuthStateChange(async (_e, s) => { S.session = s; await loadProfile(); setupRealtime(); route(); });
  setupRealtime();
  window.addEventListener('hashchange', route);
  await route();
  tampilkanPopup();
}

/* ================= NAV & ROUTER ================= */
const IC = {
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
  cart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 4h2l2.4 11h11l2-8H6.3"/><circle cx="9" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/></svg>',
  box:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/></svg>',
  coin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M14.5 9.5c-.5-.8-1.4-1.2-2.5-1.2-1.5 0-2.5.8-2.5 1.9 0 2.6 5.2 1.3 5.2 3.9 0 1.1-1.1 1.9-2.7 1.9-1.1 0-2.1-.5-2.6-1.3M12 6.5v1.8M12 15.7v1.8"/></svg>',
  user:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.2-4 4.3-6 8-6s6.8 2 8 6"/></svg>',
};
function renderNav(){
  const h = location.hash || '#/katalog';
  document.body.classList.toggle('is-admin', isAdmin());
  const L = (href, txt) => `<a href="${href}" class="${h.startsWith(href)?'on':''}">${txt}</a>`;
  const n = S.cart.reduce((a,b)=>a+b.qty,0);
  const hc = $('#hcn'); hc.textContent = n; hc.style.display = n ? '' : 'none';
  let html = '';
  if (!S.session) html = L('#/login','Masuk') + L('#/daftar','Daftar');
  else if (isAdmin()) html = L('#/admin/dashboard','Dashboard') + L('#/admin/pesanan','Pesanan') + L('#/admin/produk','Produk') + L('#/admin/member','Member & Poin') + L('#/admin/hadiah','Hadiah') + L('#/admin/penukaran','Penukaran') + L('#/admin/iklan','Iklan') + L('#/admin/pengaturan','Pengaturan') + L('#/katalog','Lihat Toko') + `<a href="#" onclick="logout();return false">Keluar</a>`;
  else html = L('#/pesanan','Pesanan Saya') + L('#/poin',`Poin <span class="badge">${S.profile?.poin??0}</span>`) + L('#/profil',esc(S.profile?.nama||'Profil')) + `<a href="#" onclick="logout();return false">Keluar</a>`;
  $('#nav').innerHTML = html;
  const B = (href, ic, txt, extra='') => `<a href="${href}" class="${(href==='#/katalog' ? (h==='#/katalog'||h==='#/'||h==='') : h.startsWith(href))?'on':''}">${ic}${extra}<span>${txt}</span></a>`;
  $('#bnav').innerHTML = B('#/katalog', IC.home, 'Beranda') + B('#/keranjang', IC.cart, 'Keranjang', n?`<span class="cbadge">${n}</span>`:'')
    + B('#/pesanan', IC.box, 'Pesanan') + B('#/poin', IC.coin, 'Poin') + B(S.session?'#/profil':'#/login', IC.user, S.session?'Saya':'Masuk');
}
function cariHeader(){
  KAT.q = $('#hq').value.trim(); KAT.kat = 'Semua';
  if (!(location.hash||'#/katalog').startsWith('#/katalog')) location.hash = '#/katalog'; else drawKatalog();
}
async function logout(){ await sb.auth.signOut(); location.hash = '#/katalog'; }

const routes = {
  '#/katalog': viewKatalog, '#/login': viewLogin, '#/daftar': viewDaftar,
  '#/keranjang': viewKeranjang, '#/checkout': viewCheckout, '#/pesanan': viewPesanan,

async function route(){
  const h = (location.hash || '#/katalog').split('?')[0];
  if (h.startsWith('#/admin') && !isAdmin()) { location.hash = S.session ? '#/katalog' : '#/login'; return; }
  if (['#/checkout','#/pesanan','#/poin','#/profil'].includes(h) && !S.session) { location.hash = '#/login'; return; }
  renderNav();
  const fn = routes[h] || viewKatalog;
  app.innerHTML = '<div class="empty">Memuat…</div>';
  try { await fn(); } catch(e){ fail(e); app.innerHTML = `<div class="card">Terjadi kesalahan: ${esc(e.message)}</div>`; }
}

async function viewKatalog(){

function drawKatalog(){

function addCart(id, diam){
  const p = KAT.list.find(x=>x.id===id); if(!p) return false;
  const c = S.cart.find(x=>x.id===id);
  if (c) { if (diam) return true; if (c.qty >= p.stok) { toast('Stok tidak cukup', true); return false; } c.qty++; }
  else S.cart.push({ id:p.id, nama:p.nama, harga:p.harga, berat:p.berat_gram, foto:p.foto_url, qty:1 });

async function cekOngkirApi(){
  try { const { data } = await sb.functions.invoke('ongkir-jnt', { body:{ action:'search', q:'xx' } }); return data && data.ok; }
  catch { return false; }
}
async function cariTujuan(q){
  if (q.length < 3) { $('#sugg').innerHTML = ''; return; }
  const { data } = await sb.functions.invoke('ongkir-jnt', { body:{ action:'search', q } });
  const list = data?.data || [];
  CO.sugg = list;
  $('#sugg').innerHTML = list.length ? `<div class="sugg">${list.map((d,i)=>`<div onclick="pilihTujuan(${i})">${esc(d.label || [d.subdistrict_name,d.district_name,d.city_name,d.province_name].join(', '))}</div>`).join('')}</div>` : '<div class="mut">Tidak ditemukan</div>';

async function pilihTujuan(i){
  const d = CO.sugg[i];
  CO.tujuan = { id: d.id, kota: d.city_name || '', kecamatan: d.district_name || '', label: d.label };
  $('#cari').value = d.label || d.district_name; $('#sugg').innerHTML = '';
  if (d.zip_code && d.zip_code !== '0') $('#kp').value = d.zip_code;

  if (!S.settings.origin_id) { $('#svc').innerHTML = '<span style="color:var(--err)">Admin belum mengisi ID kota asal (Pengaturan).</span>'; return; }
  const { data } = await sb.functions.invoke('ongkir-jnt', { body:{ action:'cost', origin:S.settings.origin_id, destination:d.id, weight:CO.berat } });
  CO.opsi = (data?.data || []).map(x=>({ layanan:x.service, ket:x.description, ongkir:x.cost, etd:x.etd }));
  drawSvc();

function drawTujuanManual(){
  $('#tujuanBox').innerHTML = `<select id="kotaM"><option value="">— pilih kota —</option>${CO.tarif.map((t,i)=>`<option value="${i}">${esc(t.kota)}</option>`).join('')}<option value="lain">Kota lain…</option></select>

    else { const t = CO.tarif[v]; CO.tujuan = { id:'', kota:t.kota }; CO.opsi = [{ layanan:'EZ', ket:'J&T Reguler', ongkir: kg * t.tarif_per_kg, etd:t.etd }]; }

function drawSvc(){

  $('#svc').innerHTML = CO.opsi.map((o,i)=>`<label class="svc"><input type="radio" name="sv" value="${i}" ${i===0?'checked':''} onchange="CO.svc=CO.opsi[${i}];hitungTotal()">

function waLink(o, bayar){
  const lines = [`*PESANAN ${o.kode}*`, `${S.settings.nama_toko||''}`, '',
    ...o.items.map(i=>`• ${i.nama} x${i.qty} = ${rp(i.harga*i.qty)}`), '',
    `Subtotal: ${rp(o.subtotal)}`, `Ongkir J&T ${o.layanan} (${kgJnt(o.berat_gram)} kg): ${rp(o.ongkir)}`, `*Total: ${rp(o.total)}*`, '',

  try { const r = await sb.functions.invoke('ongkir-jnt', { body:{ action:'track', awb:resi } }); data = r.data; if (!data?.ok) err = data?.error || r.error?.message || ''; }
  catch(e){ err = e.message; }

/* ----- Code128-B (barcode SVG tanpa library) ----- */
const C128 = ["212222","222122","222221","121223","121322","131222","122213","122312","132212","221213","221312","231212","112232","122132","122231","113222","123122","123221","223211","221132","221231","213212","223112","312131","311222","321122","321221","312212","322112","322211","212123","212321","232121","111323","131123","131321","112313","132113","132311","211313","231113","231311","112133","112331","132131","113123","113321","133121","313121","211331","231131","213113","213311","213131","311123","311321","331121","312113","312311","332111","314111","221411","431111","111224","111422","121124","121421","141122","141221","112214","112412","122114","122411","142112","142211","241211","221114","413111","241112","134111","111242","121142","121241","114212","124112","124211","411212","421112","421211","212141","214121","412121","111143","111341","131141","114113","114311","411113","411311","113141","114131","311141","411131","211412","211214","211232","2331112"];
function barcode(text, h=50){
  text = String(text).replace(/[^\x20-\x7e]/g,'');
  const codes = [104, ...[...text].map(c=>c.charCodeAt(0)-32)];
  const sum = codes.reduce((a,v,i)=>a + v*(i||1), 0) % 103;
  codes.push(sum, 106);
  let x = 10, bars = '';
  for (const c of codes) [...C128[c]].forEach((w,i)=>{ w=+w; if(i%2===0) bars += `<rect x="${x}" y="0" width="${w}" height="${h}"/>`; x += w; });
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${x+10} ${h}" preserveAspectRatio="none" style="width:100%;height:${h}px">${bars}</svg>`;

// perkecil foto sebelum upload (foto HP 3-8 MB → ±100-250 KB) supaya katalog ringan di HP
function kompresFoto(file, maks){
  return new Promise(res => {
    if (!/^image\/(jpeg|png|webp)$/.test(file.type)) return res(file);
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, maks / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
      const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => res(b && b.size < file.size ? b : file), 'image/jpeg', 0.82);
    };
    img.onerror = () => { URL.revokeObjectURL(url); res(file); };
    img.src = url;
  });
}
async function uploadFoto(file, folder){
  const blob = await kompresFoto(file, folder === 'iklan' ? 1200 : 900);
  const path = `${folder}/${Date.now()}-${file.name.replace(/\.[^.]+$/,'').replace(/[^\w]/g,'_').slice(0,40)}.jpg`;
  ok(await sb.storage.from('foto').upload(path, blob, { upsert:true, contentType: blob.type || 'image/jpeg', cacheControl: '31536000' }));
  return sb.storage.from('foto').getPublicUrl(path).data.publicUrl;
}

const hariIni = () => new Date().toLocaleDateString('sv-SE', { timeZone:'Asia/Jakarta' }); // YYYY-MM-DD
async function tampilkanPopup(){
  if (isAdmin() || (location.hash||'').startsWith('#/admin')) return;
  if (sessionStorage.getItem('popupDitutup')) return;
  const { data } = await sb.from('popups').select('*').eq('aktif', true).eq('posisi','popup').order('urutan');
  const t = hariIni();
  const list = (data||[]).filter(p => (!p.mulai || p.mulai <= t) && (!p.selesai || p.selesai >= t));
  if (list.length) popupKe(list, 0);
}
function popupKe(list, i){
  $('#popIk')?.remove();
  if (i >= list.length) { sessionStorage.setItem('popupDitutup', '1'); return; }
  const p = list[i];
  const el = document.createElement('div'); el.className = 'popik'; el.id = 'popIk';
  el.innerHTML = `<div class="box">
      <button class="x" aria-label="Tutup">✕</button>
      <img src="${esc(p.gambar_url)}" alt="${esc(p.judul)}" ${p.link?'style="cursor:pointer"':''}>
      ${p.teks_tombol ? `<button class="cta">${esc(p.teks_tombol)}</button>` : ''}
      ${list.length>1 ? `<div class="dots">${list.map((_,k)=>`<span class="${k===i?'on':''}"></span>`).join('')}</div>` : ''}
    </div>`;
  el.querySelector('.x').onclick = () => popupKe(list, i+1);
  el.onclick = e => { if (e.target === el) popupKe(list, i+1); };
  const buka = () => { if (!p.link) return; sessionStorage.setItem('popupDitutup','1'); el.remove(); bukaLinkIklan(p.link); };
  el.querySelector('img').onclick = buka; el.querySelector('.cta')?.addEventListener('click', buka);
  document.body.appendChild(el);
}
async function bukaLinkIklan(link){
  const m = link.match(/^produk:(\d+)$/);
  if (m) {
    const id = +m[1];
    if (!KAT.list.some(x=>x.id===id)) { const { data } = await sb.from('products').select('*').eq('id', id).maybeSingle(); if (data) KAT.list.push(data); }
    if (!(location.hash||'#/katalog').startsWith('#/katalog')) location.hash = '#/katalog';
    setTimeout(()=>detailProduk(id), 350);
  } else if (/^https?:\/\//.test(link)) window.open(link, '_blank');
  else location.hash = link;
}

function barisHtml(){
  const ads = KAT.ads || [];
  const no = String(S.settings.wa_toko||'').replace(/\D/g,'').replace(/^0/,'62');
  const wa = `https://wa.me/${no}?text=${encodeURIComponent('Halo, saya mau pasang iklan baris di ' + (S.settings.nama_toko||'toko'))}`;
  const items = ads.length
    ? ads.map((a,i)=>`<div class="it" style="background-image:url('${esc(a.gambar_url)}')" title="${esc(a.judul)}" onclick="${a.link?`bukaLinkIklan(KAT.ads[${i}].link)`:''}"></div>`).join('')
    : [1,2,3].map(()=>`<a class="it ph" href="${wa}" target="_blank">📢 SPACE IKLAN DISEWAKAN<small>Hubungi toko untuk pasang iklan</small></a>`).join('');
  return `<div class="baris"><div class="hd">${ads.length ? 'Promo Spesial' : 'Iklan Baris (space disewakan)'}</div>
    <button class="nv l" onclick="geserBaris(-1)" aria-label="Sebelumnya">‹</button><button class="nv r" onclick="geserBaris(1)" aria-label="Berikutnya">›</button>
    <div class="trk" id="trk">${items}</div></div>`;
}
function geserBaris(d){
  const t = $('#trk'); if (!t) return; const w = t.firstElementChild?.offsetWidth + 10 || t.clientWidth;
  if (d > 0 && t.scrollLeft + t.clientWidth >= t.scrollWidth - 5) t.scrollLeft = 0;
  else if (d < 0 && t.scrollLeft <= 5) t.scrollLeft = t.scrollWidth;
  else t.scrollLeft += d * w;
}
let BARIS_T = null;
function jalankanBaris(){
  clearInterval(BARIS_T); const t = $('#trk'); if (!t || t.scrollWidth <= t.clientWidth + 5) return;
  let jeda = false; ['mouseenter','touchstart'].forEach(ev=>t.addEventListener(ev,()=>jeda=true,{passive:true}));
  ['mouseleave','touchend'].forEach(ev=>t.addEventListener(ev,()=>setTimeout(()=>jeda=false,2500),{passive:true}));
  BARIS_T = setInterval(()=>{ if (!document.body.contains(t)) return clearInterval(BARIS_T); if (!jeda) geserBaris(1); }, 3500);
}

let AI = [], AI_TAB = 'popup';
async function viewAdminIklan(){
  AI = ok(await sb.from('popups').select('*').eq('posisi', AI_TAB).order('urutan').order('created_at',{ascending:false}));
  const t = hariIni();
  const st = p => !p.aktif ? '<span class="st batal">nonaktif</span>' : (p.mulai && p.mulai > t) ? '<span class="st menunggu">terjadwal</span>' : (p.selesai && p.selesai < t) ? '<span class="st batal">berakhir</span>' : '<span class="st selesai">tayang</span>';
  const tab = (v, t) => `<span class="chip ${AI_TAB===v?'on':''}" style="flex:none" onclick="AI_TAB='${v}';viewAdminIklan()">${t}</span>`;
  app.innerHTML = `<h1>Iklan</h1>
    <div class="row" style="flex:none;gap:6px;margin-bottom:10px">${tab('popup','1. Pop Up')}${tab('baris','2. Iklan Baris')}</div>
    <p class="mut">${AI_TAB==='popup' ? 'Pop Up muncul saat pengunjung membuka web (sekali per kunjungan) dan hilang saat tombol ✕ diklik. Beberapa iklan tayang ditampilkan bergantian sesuai urutan.' : 'Iklan Baris tampil di beranda (di bawah kategori) dan bergeser otomatis kanan–kiri. Jika belum ada iklan, tampil kotak "Space iklan disewakan".'}</p>
    <div class="toolbar"><button class="btn" onclick="formIklan()">+ Tambah ${AI_TAB==='popup'?'Pop Up':'Iklan Baris'}</button>${AI_TAB==='popup'?`<button class="btn o" onclick="sessionStorage.removeItem('popupDitutup');pratinjauIklan()">👁 Pratinjau pop up tayang</button>`:`<a class="btn o" href="#/katalog">👁 Lihat di beranda</a>`}</div>
    ${AI.length?`<div class="tw"><table><tr><th>Gambar</th><th>Judul</th><th>Klik menuju</th><th>Periode</th><th>Urutan</th><th>Status</th><th></th></tr>
    ${AI.map(p=>`<tr><td><img src="${esc(p.gambar_url)}" style="width:60px;height:80px;object-fit:cover;border-radius:4px"></td>
      <td><b>${esc(p.judul||'-')}</b>${p.teks_tombol?`<div class="mut">Tombol: ${esc(p.teks_tombol)}</div>`:''}</td>
      <td class="mut">${p.link?.startsWith('produk:') ? 'Halaman produk' : esc(p.link||'-')}</td><td class="mut">${p.mulai||'…'} s/d ${p.selesai||'…'}</td><td>${p.urutan}</td><td>${st(p)}</td>
      <td style="white-space:nowrap"><button class="btn g sm" onclick="formIklan(${p.id})">Edit</button> <button class="btn g sm" onclick="togIklan(${p.id},${!p.aktif})">${p.aktif?'Matikan':'Aktifkan'}</button></td></tr>`).join('')}</table></div>`:'<div class="empty">Belum ada iklan. Klik "+ Tambah iklan".</div>'}`;
}
async function pratinjauIklan(){
  const t = hariIni();
  const list = AI.filter(p => p.aktif && (!p.mulai || p.mulai <= t) && (!p.selesai || p.selesai >= t));
  if (!list.length) return toast('Tidak ada iklan yang sedang tayang', true);
  popupKe(list, 0); sessionStorage.removeItem('popupDitutup');
}
async function togIklan(id, v){ try { ok(await sb.from('popups').update({ aktif:v }).eq('id', id)); viewAdminIklan(); } catch(e){ fail(e); } }
async function formIklan(id){
  const p = AI.find(x=>x.id===id) || { judul:'', gambar_url:'', link:'', teks_tombol:'', aktif:true, mulai:'', selesai:'', urutan:0 };
  const prods = ok(await sb.from('products').select('id,nama').order('nama'));
  const jenis = p.link?.startsWith('produk:') ? 'produk' : p.link ? 'url' : '';
  modal(`<h2 style="margin-top:0">${id?'Edit':'Tambah'} ${AI_TAB==='popup'?'Pop Up':'Iklan Baris'}</h2><form id="fi">
    <label>Judul (untuk catatan admin)</label><input name="judul" value="${esc(p.judul)}" placeholder="mis. Promo Gajian">
    <label>Gambar iklan ${id?'(kosongkan jika tidak diganti)':''}</label><input type="file" id="fg" accept="image/*" ${id?'':'required'}>
    <div class="mut">${AI_TAB==='popup' ? 'Disarankan gambar tegak (rasio 3:4 atau 9:16), maks. ±1 MB.' : 'Disarankan gambar mendatar rasio 16:7 (mis. 1200×525 px), maks. ±1 MB.'}</div>
    <img id="pv" src="${esc(p.gambar_url)}" style="max-height:160px;margin-top:6px;border-radius:6px;${p.gambar_url?'':'display:none'}">
    <label>Saat iklan diklik, buka</label>
    <select id="lj"><option value="">Tidak ada (hanya gambar)</option><option value="produk" ${jenis==='produk'?'selected':''}>Halaman produk</option><option value="url" ${jenis==='url'?'selected':''}>Link web / WhatsApp</option></select>
    <select id="lp" style="margin-top:6px;${jenis==='produk'?'':'display:none'}">${prods.map(x=>`<option value="${x.id}" ${p.link==='produk:'+x.id?'selected':''}>${esc(x.nama)}</option>`).join('')}</select>
    <input id="lu" style="margin-top:6px;${jenis==='url'?'':'display:none'}" placeholder="https://..." value="${jenis==='url'?esc(p.link):''}">
    <label>Teks tombol (opsional)</label><input name="teks_tombol" value="${esc(p.teks_tombol)}" placeholder="mis. KLAIM SEKARANG">
    <div class="row"><div><label>Mulai tayang</label><input name="mulai" type="date" value="${p.mulai||''}"></div><div><label>Selesai tayang</label><input name="selesai" type="date" value="${p.selesai||''}"></div></div>
    <div class="row"><div><label>Urutan tampil</label><input name="urutan" type="number" value="${p.urutan}"></div>
      <div><label class="row" style="flex:none;gap:6px;margin-top:30px"><input type="checkbox" name="aktif" ${p.aktif?'checked':''} style="width:auto;flex:none"> Aktif</label></div></div>
    <div class="row" style="margin-top:14px"><button class="btn">Simpan</button>${id?`<button type="button" class="btn err" style="flex:none" onclick="hapus('popups',${id})">Hapus</button>`:''}<button type="button" class="btn g" onclick="closeModal()">Batal</button></div></form>`);
  $('#lj').onchange = e => { $('#lp').style.display = e.target.value==='produk'?'':'none'; $('#lu').style.display = e.target.value==='url'?'':'none'; };
  $('#fg').onchange = e => { const f = e.target.files[0]; if (f) { $('#pv').src = URL.createObjectURL(f); $('#pv').style.display=''; } };
  $('#fi').onsubmit = async e => {
    e.preventDefault(); const b = e.target.querySelector('button'); b.disabled = true;
    try {
      const fd = Object.fromEntries(new FormData(e.target)); const j = $('#lj').value;
      let link = j==='produk' ? 'produk:'+$('#lp').value : j==='url' ? $('#lu').value.trim() : '';
      if (j==='url' && link && !/^https?:\/\//.test(link)) link = 'https://' + link;
      const row = { posisi:AI_TAB, judul:fd.judul, teks_tombol:fd.teks_tombol, link, mulai:fd.mulai||null, selesai:fd.selesai||null, urutan:+fd.urutan||0, aktif:!!fd.aktif, gambar_url:p.gambar_url };
      const f = $('#fg').files[0]; if (f) row.gambar_url = await uploadFoto(f, 'iklan');
      ok(id ? await sb.from('popups').update(row).eq('id',id) : await sb.from('popups').insert(row));
      closeModal(); toast('Iklan tersimpan'); viewAdminIklan();
    } catch(er){ fail(er); b.disabled = false; }
  };
}

/* ================= KOORDINAT TOKO ================= */
const okKoor = (la, lo) => isFinite(la) && isFinite(lo) && Math.abs(la) <= 90 && Math.abs(lo) <= 180 && !(la == 0 && lo == 0);
function lokasiToko(){
  const la = parseFloat(S.settings.toko_lat), lo = parseFloat(S.settings.toko_lng);
  return okKoor(la, lo) ? `https://www.google.com/maps?q=${la},${lo}` : '';
}
function pasangKoordinat(){
  const upd = () => {
    const la = parseFloat($('#tlat').value), lo = parseFloat($('#tlng').value), ok_ = okKoor(la, lo);
    $('#tbuka').href = ok_ ? `https://www.google.com/maps?q=${la},${lo}` : '#';
    $('#tbuka').style.opacity = ok_ ? 1 : .5;
    $('#tpeta').innerHTML = ok_ ? `<iframe title="Peta toko" style="width:100%;height:220px;border:1px solid var(--bd);border-radius:6px" loading="lazy"
      src="https://www.openstreetmap.org/export/embed.html?bbox=${lo-0.004},${la-0.003},${lo+0.004},${la+0.003}&layer=mapnik&marker=${la},${lo}"></iframe>` : '';
  };
  $('#tlat').oninput = upd; $('#tlng').oninput = upd;
  $('#tgm').oninput = e => {
    const t = decodeURIComponent(e.target.value);
    const m = t.match(/@(-?\d+\.\d+),\s*(-?\d+\.\d+)/) || t.match(/[?&](?:q|ll|query)=(-?\d+\.\d+),\s*(-?\d+\.\d+)/) || t.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/) || t.match(/(-?\d{1,2}\.\d{3,})\s*,\s*(-?\d{1,3}\.\d{3,})/);
    if (m) { $('#tlat').value = (+m[1]).toFixed(6); $('#tlng').value = (+m[2]).toFixed(6); upd(); toast('Koordinat terisi — klik Simpan pengaturan'); }
    else if (/maps\.app\.goo\.gl|goo\.gl\/maps/.test(t)) toast('Link pendek tidak berisi koordinat. Buka linknya, lalu salin angka koordinat (tekan lama titik di peta).', true);
  };
  upd();
}
function ambilGps(){
  if (!navigator.geolocation) return toast('Browser tidak mendukung GPS', true);
  toast('Mengambil lokasi…');
  navigator.geolocation.getCurrentPosition(p => {
    $('#tlat').value = p.coords.latitude.toFixed(6); $('#tlng').value = p.coords.longitude.toFixed(6);
    $('#tlat').dispatchEvent(new Event('input')); toast(`Lokasi didapat (akurasi ±${Math.round(p.coords.accuracy)} m) — klik Simpan pengaturan`);
  }, e => toast(e.code === 1 ? 'Izin lokasi ditolak. Izinkan akses lokasi di browser.' : 'Gagal ambil lokasi: ' + e.message, true), { enableHighAccuracy:true, timeout:15000 });
}

    <h2>Ongkir J&T</h2>
    <p class="mut">Status API ongkir: ${api?'<b style="color:var(--ok)">AKTIF</b> (RajaOngkir/Komerce)':'<b style="color:var(--warn)">belum aktif</b> → memakai tarif manual di samping'}</p>

    <input type="hidden" name="origin_id" value="${esc(s.origin_id)}"><input type="hidden" name="origin_nama" value="${esc(s.origin_nama)}">
    <div class="mut">ID asal: <span id="oid">${esc(s.origin_id||'-')}</span></div>
    <label>Tarif default per kg (kota lain, mode manual)</label><input name="tarif_default_per_kg" type="number" value="${esc(s.tarif_default_per_kg)}">
    <h2>Pembayaran QRIS</h2>

    <label>Ganti gambar QRIS (opsional)</label><input type="file" id="fq" accept="image/*">
    <input type="hidden" name="qris_url" value="${esc(s.qris_url||'')}">
    <div class="mut">Upload ulang hanya jika QRIS toko berganti. Gambar asli disimpan tanpa dikompres agar tetap bisa di-scan.</div>
    <button class="btn blk" style="margin-top:14px">Simpan pengaturan</button></form></div>
    <div class="card" style="align-self:start"><h2 style="margin-top:0">Tarif manual J&T per kota</h2><p class="mut">Dipakai bila API ongkir belum aktif. Berat dibulatkan aturan J&T (toleransi 0,3 kg).</p>
    <div class="tw"><table><tr><th>Kota</th><th>Per kg</th><th>Estimasi</th><th></th></tr>${tarif.map(t=>`<tr><td>${esc(t.kota)}</td><td>${rp(t.tarif_per_kg)}</td><td>${esc(t.etd)}</td><td><button class="btn g sm" onclick="hapus('tarif_manual',${t.id})">✕</button></td></tr>`).join('')}</table></div>
